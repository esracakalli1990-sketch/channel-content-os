name: Shorts — gelen kutusu

# Telegram'a gelen videoyu alır, başlık/açıklama üretir, kanca yazısını basar
# ve YouTube ile Instagram'a yayınlar.
#
# İş tek seferlik kontrol yapmıyor: başladıktan sonra saatlerce açık kalıp
# iki dakikada bir bakıyor. Sebebi scripts/inbox_loop.sh başında yazıyor —
# GitHub bu repoda 15 dakikalık cron'u çalıştırmıyor, araya 2-3 saat giriyor.
on:
  schedule:
    # Altı saatte bir; her tur ~5,5 saat sürdüğü için geciken bir başlangıç
    # bile öncekiyle üst üste biniyor. Dakika 7, saat başındaki yığılmadan
    # uzak durmak için.
    - cron: "7 */6 * * *"
  workflow_dispatch:

# Aynı anda iki tur çalışırsa aynı videoyu iki kez yükleyebilir. Bekleyen tur
# iptal edilmiyor: sıraya girip biteni devralması, kapsamı sürekli tutuyor.
concurrency:
  group: shorts-inbox
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # GitHub işi altı saatte öldürüyor; döngü zaten 5,5 saatte duruyor.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kanca yazısı için bağımlılıklar
        # Runner'da sistem ffmpeg'i yok; tasinabilir olani pip ile geliyor.
        run: pip install --quiet Pillow imageio-ffmpeg

      - name: Telegram'ı dinle ve gelen videoyu yayınla
        env:
          PYTHONPATH: src
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Not used to build prompts here — the published record fingerprints
          # the template so template changes can be judged from the data.
          PROMPT_TEMPLATE: ${{ secrets.PROMPT_TEMPLATE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          # Instagram downloads the clip from a URL, so it is staged as a
          # release asset for the duration of the publish.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/inbox_loop.sh

      - name: Tur çökerse Telegram'dan bildir
        # Döngü kendi içindeki hataları bildiriyor; bu adım işin tamamen
        # düşmesi için — o durumda hiçbir video işlenmez ve sebebi görünmez.
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            -d parse_mode=HTML \
            --data-urlencode "text=⚠️ Gelen kutusu turu düştü — $RUN_URL" > /dev/null
