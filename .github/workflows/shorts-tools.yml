name: Shorts — araçlar

# Elle çalıştırılan tek seferlik işler. Zamanlaması yok.
#   resend   : kullanılmamış fikirleri güncel şablonla yeniden üretip yollar
#              (PROMPT_TEMPLATE değiştiğinde gerekir — kayıtlı promptlar eski
#              şablonla oluşturulmuş olur)
#   audience : izleyicilerin hangi ülkelerde olduğunu yazar; yayın saatlerini
#              tahminle değil veriyle seçmek için
#   channel  : kanal toplamları ve para kazanma eşiklerine mesafe
#   thumbnail        : son derlemenin kapağını üretip videoya koyar
#   thumbnail-preview: kapağı üretir ama koymaz, loga base64 basar (önce bakmak için)
#   backfill-dry  : yayındaki videolarda eksik olan dil ve yapay zeka beyanı
#                   alanlarını listeler, HİÇBİR ŞEY DEĞİŞTİRMEZ
#   backfill-one  : aynısını tek videoya uygular (önce bununla dene)
#   backfill-batch: bir turda en çok 40 video (~2.000 kota birimi). Günlük
#                   kota 10.000 ve her video yüklemesi 1.600 harcıyor, yani
#                   149'u tek seferde yapmak akşamki yayınları düşürürdü.
#   backfill-all  : hepsine uygular (~7.450 birim). Yalnızca o gün başka iş
#                   çalışmayacaksa. videos.update verilen bölümün tamamını
#                   değiştirdiği için sıra: backfill-dry, backfill-one,
#                   sonra batch/all.
#   audit    : her videonun ve her günün ham verisini JSON olarak loga
#              basar; "bu değişiklik işe yaradı mı" sorusu ancak tam
#              veriyle cevaplanıyor, telefona giden rapor son on videoyu
#              gösteriyor. Hiçbir şey yazmaz, sadece okur.
on:
  workflow_dispatch:
    inputs:
      job:
        description: "Hangi iş?"
        required: true
        type: choice
        options: [resend, audience, channel, audit, thumbnail, thumbnail-preview,
                  backfill-dry, backfill-one, backfill-batch, backfill-all]

concurrency:
  group: shorts-tools
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Kapak işi klip file_id'lerini kuyruk dosyasının geçmişinden okuyor.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kapak bağımlılıkları
        if: startsWith(inputs.job, 'thumbnail')
        run: pip install --quiet imageio-ffmpeg Pillow

      - name: Çalıştır
        env:
          PYTHONPATH: src
          PROMPT_TEMPLATE: ${{ secrets.PROMPT_TEMPLATE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          if [ "${{ inputs.job }}" = "audit" ]; then
            python scripts/channel_audit.py
          elif [ "${{ inputs.job }}" = "backfill-dry" ]; then
            python scripts/backfill_video_metadata.py
          elif [ "${{ inputs.job }}" = "backfill-one" ]; then
            python scripts/backfill_video_metadata.py --limit 1 --apply
          elif [ "${{ inputs.job }}" = "backfill-batch" ]; then
            python scripts/backfill_video_metadata.py --max 40 --apply
          elif [ "${{ inputs.job }}" = "backfill-all" ]; then
            python scripts/backfill_video_metadata.py --apply
          elif [ "${{ inputs.job }}" = "thumbnail-preview" ]; then
            python -m channel_ops shorts-thumbnail --preview
          else
            python -m channel_ops "shorts-${{ inputs.job }}"
          fi

      - name: Beyan kaydını işle
        # containsSyntheticMedia okunamayan bir alan, dolayısıyla hangi
        # videoların beyan edildiğini yalnızca bu dosya biliyor. İşlenmezse
        # bir sonraki tur baştan başlar ve aynı videoları tekrar yazar.
        if: ${{ startsWith(inputs.job, 'backfill') && inputs.job != 'backfill-dry' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ai_declared.json
          if git diff --cached --quiet; then
            echo "Kaydedilecek değişiklik yok."
          else
            git commit -m "chore: yapay zeka beyanı yapılan videoları kaydet"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Yenilenen promptları kaydet
        # Yalnızca resend işi dosya değiştirir; audience sadece yazdırır.
        if: ${{ inputs.job == 'resend' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/shorts_pending.json
          if git diff --cached --quiet; then
            echo "Kaydedilecek değişiklik yok."
          else
            git commit -m "chore: bekleyen promptları güncel şablonla yenile"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
