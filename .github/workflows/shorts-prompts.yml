name: Shorts — günün promptları

# Günde bir kez, gece yarısına doğru günün üç fikrini birden gönderir. Videolar
# tek oturumda üretilip Telegram'a "1", "2", "3" başlığıyla geri gönderiliyor;
# yayın saatlerini gelen kutusu kuyruğu belirliyor (shorts_pipeline.py).
#
# Saat operatörün uyanık olduğu ana göre seçildi: sabah gelen bildirim uykuda
# gözden kaçıyordu. GitHub zamanlanmış işleri geciktirebildiği için gece
# yarısından biraz önceye kuruldu, gecikirse de uyanık saate düşsün.
# "Run workflow" düğmesiyle istediğin an elle de çalıştırabilirsin.
on:
  schedule:
    - cron: "30 20 * * *" # 23:30 TRT
  workflow_dispatch:
    inputs:
      count:
        description: "Kaç fikir gönderilsin?"
        required: false
        default: "3"

# Üretilen fikirler repoya yazıldığı için aynı anda iki çalışma olmamalı.
concurrency:
  group: shorts-prompts
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Promptları üret ve gönder
        env:
          PYTHONPATH: src
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PROMPT_TEMPLATE: ${{ secrets.PROMPT_TEMPLATE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m channel_ops shorts-prompts --count "${{ inputs.count || 3 }}"

      - name: Bekleyen fikirleri kaydet
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/shorts_pending.json data/shorts_history.json
          # Fikirler değişmediyse commit atmaya çalışmak adımı hataya düşürür.
          if git diff --cached --quiet; then
            echo "Kaydedilecek değişiklik yok."
          else
            git commit -m "chore: günün shorts fikirlerini kaydet"
            # Gelen kutusu turu iki dakikada bir push ediyor; araya girmişse
            # düz push reddedilir. Reddedilirse fikir Telegram'a gitmiş ama
            # kaydedilmemiş olur, gelen video da yanlış fikirle eşleşir.
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Hata olursa Telegram'dan bildir
        # Bu is gunde bir calisiyor; sessizce coktugunde o gun hic prompt
        # gelmez ve sebebi fark edilmez.
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            -d parse_mode=HTML \
            --data-urlencode "text=⚠️ Günün promptları başarısız oldu — $RUN_URL" > /dev/null
