name: gecici - ffmpeg kontrolu
on: { workflow_dispatch: {} }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          which ffmpeg && ffmpeg -version | head -1
          echo "--- yazi tipleri ---"
          ls /usr/share/fonts/truetype/dejavu/ 2>/dev/null || echo "dejavu YOK"
          echo "--- drawtext destegi ---"
          ffmpeg -hide_banner -filters 2>/dev/null | grep -w drawtext || echo "drawtext YOK"
