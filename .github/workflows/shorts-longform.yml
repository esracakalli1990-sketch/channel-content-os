name: Shorts — uzun video derlemesi

# Yayınlanmış kliplerden uzun video derler ve YouTube'a yükler.
#
# Neden: kanal tamamen Shorts ve Shorts izlenme süresi Partner Programı'nın
# istediği 4.000 saate SAYILMIYOR. Diğer yol olan 90 günde 10 milyon Shorts
# izlenmesi ise günde 111.000 izlenme demek; kanal 10.800'de. On kat fark daha
# iyi on saniyelik klip yaparak kapanmaz. Tek bir uzun videoyu 100.000 kişi
# üç dakika izlerse eşik tek başına geçiliyor.
#
# Ham madde bedava: her klip Telegram'dan geçti, file_id'ler süresiz geçerli ve
# hem yayın kaydında hem deponun geçmişinde duruyor.
on:
  # AYLIK CRON 21 EYLÜL 2026'DA KAPATILDI. Aşağıdaki satır bilerek yorumda.
  #
  # İlk derleme (7X5KTxg9Bgg) 18 Eylül'de yayınlandı ve kanalın o güne kadarki
  # en büyük dalgasına -- 414.288 izlenme kazanan chiton Short'una -- sabitlenmiş
  # bir yorumla bağlandı. 53 saatte 107 izlenme, 0 beğeni, 0 yorum aldı.
  # Dönüşüm: %0,026, yani ~3.900 izlenmede bir tıklama. Bu haliyle 4.000 saatlik
  # eşiğe ölçülebilir bir katkı vermiyor.
  #
  # Boru hattı sağlam ve çalışıyor; sorun onda değil, varsayımda: "Shorts
  # izleyicisi aynı kliplerin uzun derlemesini izler" varsayımı tutmadı.
  # workflow_dispatch duruyor, yani elle her an çalıştırılabilir. Cron'un geri
  # açılması, derlemenin gerçek izlenme süresi ölçüldükten sonra karara bağlı
  # (Analytics API 21 Eylül'de ~5 gün geriden geliyordu, retention okunamadı).
  # Ölçülmeden ikinci bir derleme üretmek, aynı deneyi cevabı beklemeden
  # tekrarlamak olur.
  #
  #  schedule:
  #    - cron: "0 20 1 * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "Kaç dakikalık derleme?"
        required: false
        default: "11"
      reuse:
        description: "Yeni klip yetmezse eskileri tekrar kullan"
        type: boolean
        required: false
        default: false
      privacy:
        description: "Yayın görünürlüğü"
        type: choice
        options: [public, unlisted, private]
        required: false
        default: public

concurrency:
  group: shorts-longform
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    # Altmış klibi 1080p'ye çevirip birleştirmek ve yüklemek dakikalar sürüyor;
    # bu tavan sadece takılı kalan bir işi kesmek için.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # Kuyruk dosyasının geçmişi gerekiyor: yayın kaydı file_id taşımaya
          # 18 Eylül'de başladı, ondan öncekilerin tek kaynağı git geçmişi.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ffmpeg ve Pillow
        # Pillow kapak için: kapaksız uzun video tıklanmıyor.
        run: pip install --quiet imageio-ffmpeg Pillow

      - name: Derle ve yükle
        env:
          PYTHONPATH: src
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python -m channel_ops shorts-compilation \
            --minutes "${{ inputs.minutes || 11 }}" \
            --privacy "${{ inputs.privacy || 'public' }}" \
            ${{ (inputs.reuse == true) && '--reuse' || '' }}

      - name: Derleme kaydını işle
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "chore: uzun video derleme kaydını güncelle"
          git pull -q --rebase --autostash origin main && git push -q origin HEAD:main

      - name: Düşerse Telegram'dan bildir
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=⚠️ Derleme işi düştü — $RUN_URL" > /dev/null
